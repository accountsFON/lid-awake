name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build universal app
        run: sh scripts/build.sh
      - name: Check the helper script
        run: sh -n Resources/watchdog.sh && sh -n scripts/install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LidAwake
          path: dist/LidAwake.zip
